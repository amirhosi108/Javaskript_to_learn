<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple calculator application.">
  <title>Calculator App</title>
</head>

<body>
  <main>
    <header>
      <h1>Calculator</h1>
    </header>

    <section aria-label="Calculator display">
      <output aria-live="polite" aria-atomic="true">0</output>
    </section>

    <section aria-label="Calculator keypad">

      <div>
        <button type="button" data-key="seven">7</button>
        <button type="button" data-key="eight">8</button>
        <button type="button" data-key="nine">9</button>
        <button type="button" data-key="delete">DEL</button>
      </div>

      <div>
        <button type="button" data-key="four">4</button>
        <button type="button" data-key="five">5</button>
        <button type="button" data-key="six">6</button>
        <button type="button" data-key="addition">+</button>
      </div>

      <div>
        <button type="button" data-key="one">1</button>
        <button type="button" data-key="two">2</button>
        <button type="button" data-key="three">3</button>
        <button type="button" data-key="subtract">-</button>
      </div>

      <div>
        <button type="button" data-key="decimal">.</button>
        <button type="button" data-key="zero">0</button>
        <button type="button" data-key="divide">/</button>
        <button type="button" data-key="multiply">×</button>
      </div>

      <div>
        <button type="button" data-key="reset">RESET</button>
        <button type="button" data-key="calculate">=</button>
      </div>

    </section>
  </main>

  <footer class="attribution">
    Challenge by
    <a href="https://www.frontendmentor.io?ref=challenge">
      Frontend Mentor
    </a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
